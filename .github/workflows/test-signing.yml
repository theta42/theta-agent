name: test-signing (throwaway — delete after use)

# One-off smoke test for the Azure Artifact Signing OIDC setup, isolated
# from release.yml so it doesn't touch the real release/latest tag. Builds
# a trivial Windows PE, signs it, verifies the signature with signtool.
# Run manually via workflow_dispatch, then delete this file.
#
# The action requires a Windows runner -- it has an explicit runner-OS
# check baked in (Linux fails deep inside its PowerShell script with an
# opaque "Get-PackageInfo: Cannot bind argument to parameter 'Path'"
# instead of a clear error, found the hard way testing this).

on:
  workflow_dispatch:

jobs:
  test-sign:
    runs-on: windows-latest
    environment: azure-signing
    permissions:
      id-token: write
      contents: read
    env:
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
    steps:
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.2"

      - name: Build a trivial Windows PE to sign
        shell: bash
        run: |
          mkdir -p dist
          cat > hello.go <<'EOF'
          package main
          func main() { println("hello") }
          EOF
          GOOS=windows GOARCH=amd64 go build -o dist/test-signing.exe hello.go

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign with Azure Artifact Signing
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ secrets.AZURE_TS_ENDPOINT }}
          signing-account-name: ${{ secrets.AZURE_TS_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_TS_CERT_PROFILE }}
          files-folder: ${{ github.workspace }}\dist
          files-folder-filter: exe

      - name: Verify the signature
        shell: pwsh
        run: |
          $sig = Get-AuthenticodeSignature -FilePath dist\test-signing.exe
          Write-Host "Status: $($sig.Status)"
          Write-Host "Signer: $($sig.SignerCertificate.Subject)"
          if ($sig.Status -ne 'Valid') {
            throw "Signature status is $($sig.Status), expected Valid"
          }

      - uses: actions/upload-artifact@v4
        with:
          name: test-signing-exe
          path: dist/test-signing.exe
