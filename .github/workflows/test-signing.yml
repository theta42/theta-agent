name: test-signing (throwaway — delete after use)

# One-off smoke test for the Azure Trusted/Artifact Signing OIDC setup,
# isolated from release.yml so it doesn't touch the real release/latest tag.
# Builds a trivial Windows PE, signs it, verifies the signature with
# osslsigncode. Run manually via workflow_dispatch, then delete this file.

on:
  workflow_dispatch:

jobs:
  test-sign:
    runs-on: ubuntu-latest
    environment: azure-signing
    permissions:
      id-token: write
      contents: read
    env:
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
    steps:
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.2"

      - name: Build a trivial Windows PE to sign
        shell: bash
        run: |
          mkdir -p dist
          cat > /tmp/hello.go <<'EOF'
          package main
          func main() { println("hello") }
          EOF
          GOOS=windows GOARCH=amd64 go build -o dist/test-signing.exe /tmp/hello.go

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign with Azure Trusted Signing
        uses: azure/trusted-signing-action@v0.4.0
        with:
          endpoint: ${{ secrets.AZURE_TS_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.AZURE_TS_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_TS_CERT_PROFILE }}
          files: |
            dist/test-signing.exe

      - name: Verify the signature
        shell: bash
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq osslsigncode
          osslsigncode verify -in dist/test-signing.exe

      - uses: actions/upload-artifact@v4
        with:
          name: test-signing-exe
          path: dist/test-signing.exe
