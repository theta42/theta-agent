name: release

# Builds every theta-agent binary on GitHub and attaches them to the release as
# artifacts (DESIGN-WINDOWS.md §9, and the "host binaries as release artifacts"
# decision): the agent for linux/windows, the tray for linux/windows,
# the session helper for windows, and the fully-offline Inno setup.exe. Nothing
# binary is committed to the repo; consumers (install.sh, the SSO Install Agent
# modal) download from releases/latest/download/<artifact>.
# (macOS builds are disabled for now; the agent still cross-compiles for darwin
# and will be re-enabled when a macOS build/test host is stood up.)
#
# Platforms publish INDEPENDENTLY: a Linux build failure must never hold up the
# Windows installer (or vice versa). create-release shells out the tag's release
# first (no build deps), then each publish job attaches only its own platform's
# artifacts; SHA256SUMS is generated best-effort afterward and never blocks.
#
#   git tag v2.1.0 && git push origin v2.1.0
#     -> builds all binaries, compiles the installer, attaches everything

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  GO_VERSION: "1.22.2"

jobs:
  # Shell out the GitHub release for the tag so the per-platform publish jobs
  # can attach without racing to create it. Deliberately depends on nothing.
  create-release:
    name: Create GitHub release
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: false

  build-linux:
    name: agent-linux-${{ matrix.goarch }}${{ matrix.goarm }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goarch: amd64
            artifact: theta-agent-linux-amd64
          - goarch: arm64
            artifact: theta-agent-linux-arm64
          - goarch: arm
            goarm: "7"
            artifact: theta-agent-linux-armv7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Build
        shell: bash
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=${{ matrix.goarch }} GOARM=${{ matrix.goarm }} \
            go build -ldflags="-s -w" -o dist/${{ matrix.artifact }} .
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}
          if-no-files-found: error

  build-windows-agent:
    name: agent-windows-${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goarch: amd64
            artifact: theta-agent-windows-amd64.exe
          - goarch: arm64
            artifact: theta-agent-windows-arm64.exe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Build
        shell: bash
        run: |
          CGO_ENABLED=0 GOOS=windows GOARCH=${{ matrix.goarch }} \
            go build -ldflags="-s -w" -o dist/${{ matrix.artifact }} .
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}
          if-no-files-found: error

  build-desktop:
    name: tray/helper/setup
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      # One idempotent script: installs per-user Inno Setup, fetches the
      # checksum-verified vendor assets, builds agent/tray/helper for windows
      # amd64+arm64, runs go test, and compiles the offline setup.exe.
      - name: Build windows artifacts + installer
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/setup-build-env.ps1 -SkipGo -Build -CI
          if ($LASTEXITCODE -ne 0) { throw "setup-build-env failed" }

      - name: Upload windows desktop artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-desktop
          path: |
            dist/theta-agent-tray-windows-*.exe
            dist/theta-agent-helper-windows-*.exe
            dist/theta-agent-*-setup.exe
          if-no-files-found: error

  build-tray-linux:
    # The tray companion (systray) is also Linux: install.sh installs
    # theta-agent-tray-linux-* when a desktop session is present, and it 404'd
    # forever because nothing ever shipped it. systray builds fine with
    # CGO_ENABLED=0 (its Linux backend is DBus), so it is a plain cross-build
    # like the agent itself -- but it must run on ubuntu, not the
    # windows-latest job above, and install.sh only downloads linux tray
    # binaries by exact name.
    name: tray-linux-${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goarch: amd64
            artifact: theta-agent-tray-linux-amd64
          - goarch: arm64
            artifact: theta-agent-tray-linux-arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Build
        shell: bash
        run: |
          CGO_ENABLED=0 GOARCH=${{ matrix.goarch }} \
            go build -ldflags="-s -w" -o dist/${{ matrix.artifact }} ./cmd/theta-agent-tray
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}
          if-no-files-found: error

  publish-linux:
    name: Publish Linux
    needs: [create-release, build-linux, build-tray-linux]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: theta-agent-linux-*
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: theta-agent-tray-linux-*
          merge-multiple: true
      # Re-upload for the merged checksums job (linux files ship unchanged).
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: dist/
      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**
          fail_on_unmatched_files: false

  publish-windows:
    name: Publish Windows
    needs: [create-release, build-windows-agent, build-desktop]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    # Required for the federated credential's subject
    # (repo:theta42/theta-agent:environment:azure-signing) to match, and to
    # expose this environment's secrets (AZURE_CLIENT_ID etc, set via
    # `gh secret set --env azure-signing`) to this job. Azure federated
    # credentials require an EXACT subject string -- no wildcards -- so a
    # bare `ref:refs/tags/*` subject can't match every release tag; scoping
    # to a stable environment name instead of the tag ref is the documented
    # way to do OIDC federation for a tag-triggered release workflow.
    environment: azure-signing
    permissions:
      contents: write
      id-token: write
    # Bare `secrets.X` cannot be used in a step-level `if:` condition, so it
    # has to be mirrored into `env` first -- this was silently unset before,
    # which meant the two steps below's `if: env.AZURE_TENANT_ID != ''` was
    # ALWAYS false and Windows binaries never actually got signed, regardless
    # of whether the Azure secrets existed.
    env:
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: theta-agent-windows-*
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: windows-desktop
          merge-multiple: true

      # Optional Azure Trusted/Artifact Signing (OIDC federation, no stored
      # secret -- azure/login exchanges the job's GitHub OIDC token for an
      # Azure AD token via the federated credential above). Signs only
      # Windows PE files (Authenticode applies to PE/MSI; the linux binaries
      # are already self-identifying). Runs only when the Azure secrets
      # exist; otherwise the Windows artifacts ship unsigned.
      - name: Azure login (OIDC)
        if: env.AZURE_TENANT_ID != ''
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign with Azure Trusted Signing
        if: env.AZURE_TENANT_ID != ''
        uses: azure/trusted-signing-action@v0.4.0
        with:
          endpoint: ${{ secrets.AZURE_TS_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.AZURE_TS_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_TS_CERT_PROFILE }}
          files: |
            dist/*.exe

      # Re-upload the SIGNED windows files so SHA256SUMS matches what ships.
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: dist/

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**
          fail_on_unmatched_files: false

  checksums:
    name: SHA256SUMS (best-effort)
    needs: [publish-linux, publish-windows]
    # always() so a failed platform can't block the checksum of the ones that
    # shipped; continue-on-error + the empty-dir guard keep this from failing
    # the run either way.
    if: always() && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: release-*
          merge-multiple: true
          if-no-files-found: warn
      - name: Generate SHA256SUMS
        shell: bash
        run: |
          cd dist || exit 0
          [ -n "$(ls -A .)" ] || exit 0
          sha256sum * | tee SHA256SUMS
      - name: Attach checksums
        uses: softprops/action-gh-release@v2
        with:
          files: dist/SHA256SUMS
          fail_on_unmatched_files: false
